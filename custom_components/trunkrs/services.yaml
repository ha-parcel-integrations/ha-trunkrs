track_parcel:
  fields:
    tracking_code:
      required: true
      example: "TR123456789"
      selector:
        text:
    postal_code:
      required: false
      example: "1234AB"
      selector:
        text:
    contents:
      required: false
      example: "Running shoes"
      selector:
        text:

untrack_parcel:
  fields:
    tracking_code:
      required: true
      example: "TR123456789"
      selector:
        text:

update_contents:
  fields:
    tracking_code:
      required: true
      example: "TR123456789"
      selector:
        text:
    contents:
      required: false
      example: "Running shoes"
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: trunkrs
